name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Generated pages are up to date
        run: |
          npm run build
          git diff --exit-code -- . ':(exclude)sitemap.xml' || (echo "Run 'npm run build' and commit the result." && exit 1)
